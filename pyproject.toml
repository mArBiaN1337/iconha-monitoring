[project]
name = "iconha-monitoring"
version = "2.0.1"
description = "Hydrological flood and severe weather early warning system for the Rio Iconha watershed (ES, Brazil)"
readme = "README.md"
authors = [
    { name = "mArBiaN1337" }
]
requires-python = ">=3.11"
dependencies = [
    "functions-framework>=3.10.2",
    "google-cloud-storage>=2.18.0",
    "pillow>=10.4.0",
    "requests>=2.32.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2", # Used offline in scripts/backtest_jan2020.py
    "pytest>=8.3.0",
    "scipy>=1.14.0", # Used only offline in scripts/calibrate_copula.py
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[project.scripts]
iconha-monitoring = "iconha_monitoring:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
